{{define "menus/form"}}
{{template "admin_start" .}}
<div class="page-head">
  <div>
    <h1>{{.Title}}</h1>
    <p>设置菜单名称、路由路径、图标和上下级关系。</p>
  </div>
  <a class="btn" href="/menus">返回列表</a>
</div>
<form class="card form-card" data-menu-form data-mode="{{.Mode}}" data-id="{{.ID}}">
  <div class="form-grid">
    <label class="field">
      <span>上级菜单</span>
      <select name="parent_id">
        <option value="0">顶级菜单</option>
      </select>
    </label>
    <label class="field">
      <span>菜单名称</span>
      <input name="title" required>
    </label>
    <label class="field">
      <span>图标</span>
      <input name="icon" placeholder="例如 ▣ / ⚙">
    </label>
    <label class="field">
      <span>路径</span>
      <input name="path" placeholder="/users">
    </label>
    <label class="field">
      <span>排序</span>
      <input name="sort" type="number" value="10">
    </label>
    <label class="switch-row">
      <input name="visible" type="checkbox" value="1" checked>
      <span>左侧菜单显示</span>
    </label>
    <label class="switch-row">
      <input name="status" type="checkbox" value="1" checked>
      <span>启用菜单</span>
    </label>
  </div>
  <div class="form-actions">
    <button class="btn primary" type="submit">保存</button>
    <a class="btn" href="/menus">取消</a>
  </div>
</form>
{{template "admin_end" .}}
{{end}}
