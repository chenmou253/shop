{{define "menus/index"}}
{{template "admin_start" .}}
<div class="page-head">
  <div>
    <h1>菜单管理</h1>
    <p>维护后台左侧导航，支持上下级树形结构。</p>
  </div>
  <a class="btn primary" href="/menus/new">新增菜单</a>
</div>
<div class="card">
  <div class="card-header">
    <h2>菜单树</h2>
    <div class="card-tools">
      <button class="btn small" type="button" data-expand-table>全部展开</button>
      <button class="btn small" type="button" data-collapse-table>全部折叠</button>
    </div>
  </div>
  <div class="table-wrap">
    <table class="table tree-table" data-tree-table>
      <thead>
        <tr>
          <th>ID</th>
          <th>菜单名称</th>
          <th>路径</th>
          <th>排序</th>
          <th>显示</th>
          <th>状态</th>
          <th class="actions">操作</th>
        </tr>
      </thead>
      <tbody id="menus-table" data-menus-table>
        <tr><td colspan="7" class="empty-cell">加载中...</td></tr>
      </tbody>
    </table>
  </div>
</div>
{{template "admin_end" .}}
{{end}}
