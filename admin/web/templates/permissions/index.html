{{define "permissions/index"}}
{{template "admin_start" .}}
<div class="page-head">
  <div>
    <h1>权限管理</h1>
    <p>维护按钮、接口和数据操作权限，支持上下级树形结构。</p>
  </div>
  <a class="btn primary" href="/permissions/new">新增权限</a>
</div>
<div class="card">
  <div class="card-header">
    <h2>权限树</h2>
    <div class="card-tools">
      <button class="btn small" type="button" data-expand-table>全部展开</button>
      <button class="btn small" type="button" data-collapse-table>全部折叠</button>
    </div>
  </div>
  <div class="table-wrap">
    <table class="table tree-table" data-tree-table>
      <thead>
        <tr>
          <th>ID</th>
          <th>权限名称</th>
          <th>标识</th>
          <th>菜单</th>
          <th>请求</th>
          <th>路径</th>
          <th>状态</th>
          <th class="actions">操作</th>
        </tr>
      </thead>
      <tbody id="permissions-table" data-permissions-table>
        <tr><td colspan="8" class="empty-cell">加载中...</td></tr>
      </tbody>
    </table>
  </div>
</div>
{{template "admin_end" .}}
{{end}}
